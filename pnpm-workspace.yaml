engineStrict: true

# Supply-chain hardening: refuse to install any package version (direct or
# transitive) published less than 3 days ago. This is a "release-age gate" —
# the equivalent of Yarn's npmMinimalAgeGate. It gives the community time to
# spot and pull malicious releases before they can reach this project.
# Value is in minutes: 3 days = 3 * 24 * 60 = 4320.
minimumReleaseAge: 4320
